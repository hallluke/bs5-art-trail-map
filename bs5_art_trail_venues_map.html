scape and abstract painting exploring dense green overgrowth and shifting light. Polkadot Studio — paintings, prints, tribal, abstract, geometric and cut-outs. Rob Elgar Art — studio and plein-air oil landscapes of countryside, woodlands and UK coastline. Robert Mills — figurative paintings and artist’s books concerning dreams, stories, politics and myth. Rosanna Morris — Bristol linocuts inspired by land, food, seasons and community. Sky Siouki — ethereal, dreamlike abstract paintings rooted in nature and the forest. The Fever Few Clothing — womenswear designed as elevated, long-lasting everyday garments. Zubieta — brightly coloured surrealist work exploring pop culture, social media, psychedelia and nature.</i></p>     </div>`)[0];
